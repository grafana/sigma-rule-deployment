name: "Close Integration Test PR"

on:
  pull_request:
    types:
      - closed

permissions: {}

jobs:
  close-integration-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Get GitHub App Token
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@5bbb526b1728ca57fbe1750c4c27ab6ab06171c2 # create-github-app-token/v1.0
        with:
          github_app: sigma-rule-deployment-app
      - name: Close PR
        env:
          GITHUB_TOKEN: ${{ steps.get-github-app-token.outputs.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close --repo grafana/sigma-rule-deployment-integration-test "integration-test-pr-${GITHUB_PR_NUMBER}" -c "Closed by GitHub Actions, tests completed" -d || true
