name: "Build & Integration Test Image"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

jobs:
  build:
    name: "Build and Push Docker Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fork pull requests get a read-only GITHUB_TOKEN and no secrets, so they
      # cannot push to the org GHCR namespace. Detect them so we build+export an
      # artifact instead of pushing. A maintainer then runs the integration test
      # manually from the integration-test repo (workflow_dispatch).
      - name: "Determine PR origin"
        id: origin
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          fi
      - name: "Login to GitHub Container Registry"
        # Skip for fork PRs: the token cannot write org packages and login is not
        # needed to build + export a local image artifact.
        if: github.event_name != 'pull_request' || steps.origin.outputs.is_fork == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Build and Push (same-repo PR)"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: github.event_name == 'pull_request' && steps.origin.outputs.is_fork == 'false'
        with:
          context: .
          file: ./Dockerfile
          tags: |
            ghcr.io/grafana/sigma-rule-deployment/sigma-rule-deployer:sha-${{ github.event.pull_request.head.sha }}
          push: true
      - name: "Prepare fork artifact directory"
        if: github.event_name == 'pull_request' && steps.origin.outputs.is_fork == 'true'
        run: mkdir -p /tmp/pr-image
      - name: "Build and Load (fork PR)"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: github.event_name == 'pull_request' && steps.origin.outputs.is_fork == 'true'
        with:
          context: .
          file: ./Dockerfile
          tags: |
            ghcr.io/grafana/sigma-rule-deployment/sigma-rule-deployer:sha-${{ github.event.pull_request.head.sha }}
          push: false
          load: true
      - name: "Export fork PR image to tarball"
        if: github.event_name == 'pull_request' && steps.origin.outputs.is_fork == 'true'
        env:
          IMAGE_TAG: ghcr.io/grafana/sigma-rule-deployment/sigma-rule-deployer:sha-${{ github.event.pull_request.head.sha }}
        run: docker save -o /tmp/pr-image/pr-image.tar "$IMAGE_TAG"
      - name: "Write fork PR metadata"
        if: github.event_name == 'pull_request' && steps.origin.outputs.is_fork == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          IMAGE_TAG: ghcr.io/grafana/sigma-rule-deployment/sigma-rule-deployer:sha-${{ github.event.pull_request.head.sha }}
        run: |
          jq -n \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_repo "$HEAD_REPO" \
            --arg image_tag "$IMAGE_TAG" \
            '{pr_number: $pr_number, head_sha: $head_sha, head_repo: $head_repo, image_tag: $image_tag}' \
            > /tmp/pr-image/metadata.json
      - name: "Upload fork PR image artifact"
        if: github.event_name == 'pull_request' && steps.origin.outputs.is_fork == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-image
          path: /tmp/pr-image
          retention-days: 3
          if-no-files-found: error
      - name: "Build and Push (Push)"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: github.event_name == 'push'
        with:
          context: .
          file: ./Dockerfile
          tags: |
            ghcr.io/grafana/sigma-rule-deployment/sigma-rule-deployer:sha-${{ github.sha }}
            ghcr.io/grafana/sigma-rule-deployment/sigma-rule-deployer:main
          push: true
      - name: "Build and Push (Release)"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: github.event_name == 'release'
        with:
          context: .
          file: ./Dockerfile
          tags: |
            ghcr.io/grafana/sigma-rule-deployment/sigma-rule-deployer:${{ github.event.release.tag_name }}
          push: true

  test-pr:
    # Prevent concurrent execution of integration tests to avoid multiple executions commiting to main simultaneously
    # We **need** to commit to main to test the commenting feature
    # Use concurrency queuing rather than just killing the existing jobs
    concurrency:
      group: ${{ github.workflow }}
      queue: max


    # Only same-repo PRs run the integration test automatically here (they have
    # secrets + a package-write token). Fork PRs export an image artifact in the
    # build job above; a maintainer runs the integration test manually from the
    # integration-test repo via the "External Fork PR Integration Test"
    # workflow_dispatch.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: "Integration Testing"
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get GitHub App Token
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: sigma-rule-deployment-app
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}
          persist-credentials: false
          path: ./sigma-rule-deployment
      - name: Checkout Integration Test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}
          persist-credentials: true
          repository: grafana/sigma-rule-deployment-integration-test
          path: ./sigma-rule-deployment-integration-test
      - name: Create new branch
        id: integration-pr
        working-directory: ./sigma-rule-deployment-integration-test
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ steps.get-github-app-token.outputs.token }}
          ACTION_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          PR_BRANCH: integration-test-pr-${{ github.event.pull_request.number }}
        run: |
          git fetch

          # Close the current test PR before the branch is reset below. A new one is opened once
          # the commit is in place, so no PR is ever left open on an empty branch.
          OPEN_PR=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq 'first.number // empty')
          if [ -n "$OPEN_PR" ]; then
            gh pr close "$OPEN_PR"
          fi

          EXPECTED_HEAD_OID=$(../sigma-rule-deployment/.github/scripts/checkout-or-create-branch.sh \
            grafana/sigma-rule-deployment-integration-test \
            "$PR_BRANCH" \
            main)

          # remove old test files, if they exist
          rm -rf ./rules
          rm -rf ./pipelines
          rm test.yml
          rm config.yml

          cp -R ../sigma-rule-deployment/integration-test/* ./
          sed -i "s/uses: grafana\/sigma-rule-deployment\/actions\/convert@.*/uses: grafana\/sigma-rule-deployment\/actions\/convert@$ACTION_SHA/g" ./.github/workflows/convert-integrate-test.yml
          sed -i "s/uses: grafana\/sigma-rule-deployment\/actions\/integrate@.*/uses: grafana\/sigma-rule-deployment\/actions\/integrate@$ACTION_SHA/g" ./.github/workflows/convert-integrate-test.yml

          # add the action sha so that the integration test can add the check to this PR
          echo "$ACTION_SHA" > action_sha.txt
          echo "$GITHUB_PR_NUMBER" > github_pr.txt
          # per-run token guarantees a change even when re-running on the PR
          echo "$RUN_TOKEN" > run_attempt.txt

          git add -A

          ../sigma-rule-deployment/.github/scripts/create-verified-commit.sh \
            grafana/sigma-rule-deployment-integration-test \
            "$PR_BRANCH" \
            "$EXPECTED_HEAD_OID" \
            "update integration test configuration"

          # Open the test PR now that the branch is a commit ahead of main. This fires the
          # `pull_request` event that posts the check, and the URL gives us the number to reuse
          # in the next step.
          TEST_PR_URL=$(gh pr create \
            --title "Integration Test PR ${GITHUB_PR_NUMBER}" \
            --body "This PR to test Sigma Rule Deployment App from Sigma Rule Deployment Integration Test App for grafana/sigma-rule-deployment#${GITHUB_PR_NUMBER}" \
            --head "$PR_BRANCH" \
            --base main \
            --draft \
            --label "automated")

          echo "Created $TEST_PR_URL"
          echo "pr-number=${TEST_PR_URL##*/}" >> "$GITHUB_OUTPUT"
      - name: Update integration main branch to latest and send test comment
        working-directory: ./sigma-rule-deployment-integration-test
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ steps.get-github-app-token.outputs.token }}
          ACTION_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MAIN_UPDATE_BRANCH: integration-test-main-update-${{ github.event.pull_request.number }}
          TEST_PR_NUMBER: ${{ steps.integration-pr.outputs.pr-number }}
        run: |
          git fetch
          git checkout main
          git pull

          EXPECTED_HEAD_OID=$(../sigma-rule-deployment/.github/scripts/checkout-or-create-branch.sh \
            grafana/sigma-rule-deployment-integration-test \
            "$MAIN_UPDATE_BRANCH" \
            main)

          sed -i "s/uses: grafana\/sigma-rule-deployment\/actions\/convert@.*/uses: grafana\/sigma-rule-deployment\/actions\/convert@$ACTION_SHA/g" ./.github/workflows/convert-integrate-comment-test.yml
          sed -i "s/uses: grafana\/sigma-rule-deployment\/actions\/integrate@.*/uses: grafana\/sigma-rule-deployment\/actions\/integrate@$ACTION_SHA/g" ./.github/workflows/convert-integrate-comment-test.yml

          # add the action sha so that the integration test can add the check to this PR
          echo "$ACTION_SHA" > action_sha.txt
          echo "$GITHUB_PR_NUMBER" > github_pr.txt
          # per-run token guarantees a change even when re-running on the PR
          echo "$RUN_TOKEN" > run_attempt.txt

          # only commit the relevant changed files
          git add .github/workflows/convert-integrate-comment-test.yml action_sha.txt github_pr.txt run_attempt.txt

          ../sigma-rule-deployment/.github/scripts/create-verified-commit.sh \
            grafana/sigma-rule-deployment-integration-test \
            "$MAIN_UPDATE_BRANCH" \
            "$EXPECTED_HEAD_OID" \
            "update main branch to relevant hash"

          RESULT=$(gh pr list --json id,title -H "$MAIN_UPDATE_BRANCH" | jq -r '. | length')

          if [ "$RESULT" -eq 0 ]; then
            gh pr create \
              --title "Integration Test Main Update ${GITHUB_PR_NUMBER}" \
              --body "This PR updates the main branch to the relevant hash for grafana/sigma-rule-deployment#${GITHUB_PR_NUMBER}" \
              --head "$MAIN_UPDATE_BRANCH" \
              --base main \
              --label "automated" \
              --draft
          fi

          # Wait for the checks to register; the `--watch` below fails outright if none exist yet.
          ATTEMPT=0
          while [ "$(gh pr checks "$MAIN_UPDATE_BRANCH" --json name --jq 'length' 2>/dev/null || echo 0)" -eq 0 ]; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge 24 ]; then
              echo "No checks registered on ${MAIN_UPDATE_BRANCH}"
              exit 1
            fi
            sleep 5
          done

          if ! gh pr checks "$MAIN_UPDATE_BRANCH" --watch; then
            echo "Integration Test Main Update PR failed"
            exit 1
          fi

          gh pr ready "$MAIN_UPDATE_BRANCH"

          # Arm the merge, then ask the author to approve it and wait. Approval is mandatory on
          # this repo, so --auto only queues the merge, and the comment further down needs main
          # to already carry this commit.
          gh pr merge "$MAIN_UPDATE_BRANCH" --auto --squash

          STATE=$(gh pr view "$MAIN_UPDATE_BRANCH" --json state -q .state)
          if [ "$STATE" != "MERGED" ]; then
            gh pr comment "$MAIN_UPDATE_BRANCH" --body "@${PR_AUTHOR} this repository requires a manual merge — please review and merge this PR so the integration test can continue."

            echo "Waiting for $MAIN_UPDATE_BRANCH to be manually merged..."
            while [ "$STATE" != "MERGED" ]; do
              if [ "$STATE" = "CLOSED" ]; then
                echo "$MAIN_UPDATE_BRANCH was closed without merging"
                exit 1
              fi
              sleep 30
              STATE=$(gh pr view "$MAIN_UPDATE_BRANCH" --json state -q .state)
            done
          fi

          # Wait for main to carry this commit. The comment below triggers an `issue_comment`
          # workflow, which runs from main and reads action_sha.txt there to pick the commit it
          # reports "Integration Testing - Comment" against.
          ATTEMPT=0
          while true; do
            git fetch origin main --quiet
            MAIN_ACTION_SHA=$(git show origin/main:action_sha.txt | tr -d '[:space:]')
            if [ "$MAIN_ACTION_SHA" = "$ACTION_SHA" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge 24 ]; then
              echo "integration test main reports action_sha=${MAIN_ACTION_SHA}, expected ${ACTION_SHA}"
              exit 1
            fi
            sleep 5
          done

          # Check the test PR is still open before commenting on it. close-integration-test.yml
          # closes it if this PR was closed during the wait above, and a comment on a closed PR
          # would start a convert run that fails later on an empty base-commit.
          PR_JSON=$(gh pr view "$TEST_PR_NUMBER" --json state,commits)
          TEST_PR_STATE=$(jq -r '.state' <<<"$PR_JSON")
          TEST_PR_COMMITS=$(jq -r '.commits | length' <<<"$PR_JSON")

          if [ "$TEST_PR_STATE" != "OPEN" ] || [ "$TEST_PR_COMMITS" -lt 1 ]; then
            echo "Integration test PR #${TEST_PR_NUMBER} is ${TEST_PR_STATE} with ${TEST_PR_COMMITS} commits, refusing to comment"
            exit 1
          fi

          echo "Integration test PR: [#${TEST_PR_NUMBER}](https://github.com/grafana/sigma-rule-deployment-integration-test/pull/${TEST_PR_NUMBER})" >> "$GITHUB_STEP_SUMMARY"

          # Post the "sigma-convert-all" comment in a loop in case of api failure.
          COMMENT_BODY=$(printf 'sigma convert all\n\nTriggered by %s#%s, commit %s@%s' \
            "$GITHUB_REPOSITORY" "$GITHUB_PR_NUMBER" "$GITHUB_REPOSITORY" "$ACTION_SHA")

          ATTEMPT=0
          until gh pr comment "$TEST_PR_NUMBER" --body "$COMMENT_BODY"; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge 3 ]; then
              echo "Could not comment on PR #${TEST_PR_NUMBER}"
              exit 1
            fi
            sleep 5
          done
