name: Convert and Integrate Sigma Rules

on:
  workflow_call:
    inputs:
      config_path:
        description: "Path to the Sigma conversion config file"
        required: true
        type: string
      plugin_packages:
        description: "Comma-separated list of Sigma CLI plugin packages to install"
        required: false
        type: string
        default: ""
      render_traceback:
        description: "Whether to render the traceback in the output"
        required: false
        type: boolean
        default: false
      pretty_print:
        description: "Pretty print the JSON output"
        required: false
        type: boolean
        default: false
      output_log_lines:
        description: "Output log lines to the outputs of the test_query_results_file"
        required: false
        type: boolean
        default: false
      all_rules:
        description: "Convert all rules specified in the config file, can be controlled by commenting `sigma convert all` in a PR"
        required: false
        type: boolean
        default: false
      actions_username:
        description: "Username of the automation that commits conversions"
        required: false
        type: string
        default: "github-actions[bot]"
      changed_files_from_base:
        description: "Whether to use the changed files from the base branch"
        required: false
        type: boolean
        default: false
      continue_on_query_testing_errors:
        description: "Continue integration process even when query testing fails, but print errors and continue the action"
        required: false
        type: boolean
        default: true
      vault_path:
        description: "A path to the Grafana service account token described in secrets.grafana_sa_token, but stored in Grafana's internal Vault"
        required: false
        type: string
        default: ""
    secrets:
      grafana_sa_token:
        description: "A Grafana service account token for testing queries (or a JSON object mapping each Grafana instance URL to its own token), with at least the following role: Data sources:Reader"
        required: false

jobs:
  convert-integrate:
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.action == 'created')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to read Sigma rules and write intermediary files
      id-token: write # to get vault secrets
      packages: read # to pull the Action docker image
      pull-requests: write # to update the relevant pull request
    steps:
      - name: Validate vault_path input
        if: ${{ inputs.vault_path != '' }}
        env:
          VAULT_PATH: ${{ inputs.vault_path }}
        run: |
          if printf '%s' "$VAULT_PATH" | grep -qP '[\r\n]'; then
            echo "vault_path must not contain newlines"
            exit 1
          fi

      - name: Get service account token for instance from Vault
        if: ${{ inputs.vault_path != '' }}
        id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3 # get-vault-secrets/v2.1
        with:
          repo_secrets: ${{ format('GRAFANA_SA_TOKEN={0}', inputs.vault_path) }}

      - name: Get PR branch for comments
        if: github.event_name == 'issue_comment'
        id: get-pr-branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
            });
            console.log(`PR head branch: ${pullRequest.head.ref}`);
            return pullRequest.head.ref;
          result-encoding: string

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'issue_comment' && steps.get-pr-branch.outputs.result || github.head_ref }}
          fetch-depth: 0

      # Parses `sigma convert|integrate` commands from the comment into the outputs
      # that drive the steps below. Unset for comment events.
      - name: Parse sigma comment
        if: github.event_name == 'issue_comment'
        id: parse
        uses: $/actions/parse-comment
        with:
          comment_body: ${{ github.event.comment.body }}
          comment_author_association: ${{ github.event.comment.author_association }}
          comment_author_login: ${{ github.event.comment.user.login }}
          comment_author_type: ${{ github.event.comment.user.type }}
          comment_id: ${{ github.event.comment.id }}
          issue_number: ${{ github.event.issue.number }}
          config_path: ${{ inputs.config_path }}
          github_token: ${{ github.token }}

      - name: Convert Sigma rules
        if: github.event_name != 'issue_comment' || (steps.parse.outputs.triggered == 'true' && steps.parse.outputs.action == 'convert')
        uses: $/actions/convert
        with:
          config_path: ${{ inputs.config_path }}
          plugin_packages: ${{ inputs.plugin_packages }}
          render_traceback: ${{ inputs.render_traceback || steps.parse.outputs.debug == 'true' }}
          pretty_print: ${{ inputs.pretty_print || steps.parse.outputs.debug == 'true' }}
          all_rules: ${{ steps.parse.outputs.all_rules == 'true' || (github.event_name != 'issue_comment' && inputs.all_rules) }}
          actions_username: ${{ inputs.actions_username }}
          changed_files_from_base: ${{ inputs.changed_files_from_base }}
          configurations: ${{ steps.parse.outputs.configurations }}

      - name: Integrate queries into alert rules
        if: github.event_name != 'issue_comment' || steps.parse.outputs.triggered == 'true'
        uses: $/actions/integrate
        with:
          config_path: ${{ inputs.config_path }}
          grafana_sa_token: ${{ secrets.grafana_sa_token || fromJSON(steps.get-secrets.outputs.secrets || '{}').GRAFANA_SA_TOKEN }}
          pretty_print: ${{ inputs.pretty_print || steps.parse.outputs.debug == 'true' }}
          output_log_lines: ${{ inputs.output_log_lines || steps.parse.outputs.debug == 'true' }}
          # A targeted run (configurations set) integrates all of the selected
          # configurations' files: integrate-only commands produce no conversion
          # diff for the changed-files detection to key off.
          all_rules: ${{ steps.parse.outputs.all_rules == 'true' || steps.parse.outputs.configurations != '' || (github.event_name != 'issue_comment' && inputs.all_rules) }}
          actions_username: ${{ inputs.actions_username }}
          changed_files_from_base: ${{ inputs.changed_files_from_base }}
          continue_on_query_testing_errors: ${{ inputs.continue_on_query_testing_errors }}
          configurations: ${{ steps.parse.outputs.configurations }}
          skip_query_testing: ${{ steps.parse.outputs.no_test == 'true' }}
          query_time_window: ${{ steps.parse.outputs.query_time_window }}

      - name: Commit queries and alert rules
        if: github.event_name != 'issue_comment' || steps.parse.outputs.triggered == 'true'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "Sigma Rules Deployment"
          branch: ${{ github.event_name == 'issue_comment' && steps.get-pr-branch.outputs.result || github.head_ref }}
          commit_options: '--allow-empty'
          skip_checkout: true
          skip_fetch: true
          skip_dirty_check: true
